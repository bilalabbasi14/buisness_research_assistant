<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Research Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            color-scheme: dark;
            --bg: #0a0f0e;
            --bg-elev: #0f1514;
            --bg-panel: #101b1a;
            --panel-soft: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e7efed;
            --muted: #96a4a1;
            --accent: #2cb79b;
            --accent-strong: #1f8a77;
            --accent-glow: rgba(44, 183, 155, 0.4);
            --warning: #c89b48;
            --shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", "Helvetica Neue", sans-serif;
            background-color: #070b0a;
            background-image:
                radial-gradient(900px 600px at 12% 0%, rgba(44, 183, 155, 0.16), transparent 60%),
                radial-gradient(800px 560px at 90% 12%, rgba(200, 155, 72, 0.12), transparent 55%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            width: min(900px, 96vw);
            background: linear-gradient(170deg, rgba(22, 33, 32, 0.98), rgba(14, 20, 20, 0.98) 55%, rgba(18, 26, 25, 0.98));
            border-radius: 22px;
            box-shadow: var(--shadow), 0 0 40px rgba(44, 183, 155, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            height: min(880px, 92vh);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0) 38%);
            pointer-events: none;
        }

        .header {
            padding: 22px 30px 18px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(16, 24, 23, 0.96), rgba(12, 18, 18, 0.96));
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header h1 {
            font-family: "Poppins", "Helvetica Neue", sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .header p {
            font-size: 13px;
            color: var(--muted);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(44, 183, 155, 0.12);
            border: 1px solid rgba(44, 183, 155, 0.32);
            font-size: 12px;
            color: #cfeee7;
            white-space: nowrap;
            box-shadow: 0 0 14px rgba(44, 183, 155, 0.18);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #33d6b4;
            box-shadow: 0 0 8px rgba(51, 214, 180, 0.8);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 26px 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(180deg, rgba(44, 183, 155, 0.08), rgba(44, 183, 155, 0));
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.65;
            border: 1px solid transparent;
            animation: float-in 200ms ease-out;
        }

        .message.user {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #f1fffb;
            align-self: flex-end;
            border: 1px solid rgba(44, 183, 155, 0.45);
            box-shadow: 0 10px 24px rgba(44, 183, 155, 0.26), 0 0 18px rgba(44, 183, 155, 0.22);
        }

        .message.assistant {
            background: var(--panel-soft);
            color: var(--text);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .message.assistant.clarification {
            background: rgba(200, 155, 72, 0.16);
            border: 1px solid rgba(200, 155, 72, 0.35);
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: -8px;
            margin-bottom: 6px;
            padding-left: 4px;
            align-self: flex-start;
        }

        .input-area {
            padding: 18px 30px;
            border-top: 1px solid var(--border);
            background: rgba(12, 18, 18, 0.95);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: var(--bg-panel);
            color: var(--text);
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-area input::placeholder {
            color: rgba(154, 164, 178, 0.8);
        }

        .input-area input:focus {
            border-color: rgba(44, 183, 155, 0.7);
            box-shadow: 0 0 0 3px rgba(44, 183, 155, 0.16);
        }

        .input-area button {
            padding: 11px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #f1fffb;
            border: 1px solid rgba(44, 183, 155, 0.5);
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 150ms ease;
        }

        .input-area button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px var(--accent-glow), 0 0 18px rgba(44, 183, 155, 0.2);
        }

        .input-area button:disabled {
            background: rgba(255, 255, 255, 0.08);
            border-color: transparent;
            color: rgba(231, 239, 237, 0.6);
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .typing {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 12px 16px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: rgba(231, 239, 237, 0.6);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0)
            }

            40% {
                transform: translateY(-6px)
            }
        }

        @keyframes float-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        @media (max-width: 640px) {
            .container {
                height: 94vh;
            }

            .messages,
            .input-area,
            .header {
                padding-left: 18px;
                padding-right: 18px;
            }

            .message {
                max-width: 90%;
            }

            .title-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title-row">
                <div class="title-stack">
                    <h1>Business Research Assistant</h1>
                    <p>Ask about any company - news, financials, leadership, competitors</p>
                </div>
                <div class="status-pill"><span class="status-dot"></span>Online</div>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="message assistant">Hi! Ask me anything about a company. For example: <em>"What are Apple's
                    latest financial results?"</em> or <em>"Tell me about Tesla's recent news."</em></div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Ask about a company..."
                onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let sessionId = null;

        function renderMarkdown(text) {
            // Escape HTML first
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            // ## Headers
            html = html.replace(/^## (.+)$/gm, '<strong style="display:block;margin-top:10px;font-size:15px;">$1</strong>');
            // **bold**
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Newlines
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function addMessage(text, role, meta = "") {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "message " + role;
            if (role === "assistant" && meta.includes("clarification")) div.classList.add("clarification");
            if (role === "assistant") {
                div.innerHTML = renderMarkdown(text);
            } else {
                div.textContent = text;
            }
            msgs.appendChild(div);
            if (meta) {
                const m = document.createElement("div");
                m.className = "meta";
                m.textContent = meta;
                msgs.appendChild(m);
            }
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showTyping() {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "message assistant typing";
            div.id = "typing-indicator";
            div.innerHTML = "<span></span><span></span><span></span>";
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById("typing-indicator");
            if (t) t.remove();
        }

        async function sendMessage() {
            const input = document.getElementById("input");
            const btn = document.getElementById("send-btn");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";
            btn.disabled = true;
            showTyping();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await res.json();
                sessionId = data.session_id;
                removeTyping();

                const isClarification = data.status === "needs_clarification";
                const metaInfo = !isClarification && data.confidence_score != null
                    ? `Confidence: ${data.confidence_score}/10 - Attempts: ${data.attempts}`
                    : isClarification ? "clarification" : "";

                addMessage(data.response, "assistant", metaInfo);
            } catch (err) {
                removeTyping();
                addMessage("Something went wrong. Please try again.", "assistant");
            }

            btn.disabled = false;
            input.focus();
        }
    </script>
</body>

</html>
